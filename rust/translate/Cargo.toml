[package]
name = "synth-translate"
version = "0.1.0"
edition = "2021"
description = "Reusable offline language detection and local text translation"
publish = false

# Keep verification independent of a consuming application's workspace.
[workspace]
resolver = "2"

[features]
default = []
catalog-http = ["dep:reqwest"]

[dependencies]
fxtranslate = { version = "=0.5.0", default-features = false, features = ["portable", "lean-embed", "mmap", "threads"] }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
whatlang = "=0.18.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
