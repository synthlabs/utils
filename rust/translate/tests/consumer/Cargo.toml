[package]
name = "synth-translate-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false }
translate-build = { path = "../../../translate-build" }

[dependencies]
synth-translate = { path = "../..", features = ["tauri-test"] }
tauri = { version = "2.12.5", default-features = false, features = ["test"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
