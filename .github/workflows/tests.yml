name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/inbound -> target
            rust/inbound-build -> target
            rust/synth-tauri-runtime -> target
            rust/translate -> target
            rust/translate-build -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install_deps.sh --ci

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors `pnpm verify` with per-platform limits; enforced by scripts/ci-contract.test.mjs.
      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Script tests
        run: pnpm test:scripts

      - name: Rust tests
        run: pnpm test:rust

      - name: Go tests
        run: pnpm test:go

      - name: Packaging tests
        if: runner.os != 'macOS'
        run: pnpm test:packaging

      - name: Rust lint
        run: pnpm lint:rust

      - name: Dependency locks and whitespace
        if: always()
        run: >-
          git diff --exit-code --
          pnpm-lock.yaml
          go/go.mod
          go/go.sum
          rust/inbound/Cargo.lock
          rust/inbound-build/Cargo.lock
          rust/synth-tauri-runtime/Cargo.lock
          rust/translate/Cargo.lock
          rust/translate-build/Cargo.lock
          && git diff --check

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.platform }}
          path: target/test-results/
          if-no-files-found: ignore

  packaging-aur:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: AUR SSH container tests
        run: pnpm test:packaging:aur

  translate:
    uses: ./.github/workflows/translate.yml
